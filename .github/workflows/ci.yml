name: verification
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fatty_test
          POSTGRES_USER: fatty_test
          POSTGRES_PASSWORD: testonly
        volumes:
          - /tmp/fattycisocket:/var/run/postgresql
        options: >-
          --health-cmd 'pg_isready -U fatty_test -d fatty_test'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FATTY_TEST_POSTGRES_DSN: dbname=fatty_test user=fatty_test password=testonly host=/tmp/fattycisocket
      # No live credentials are available to this job. Do not set production
      # mode/gate defaults here: environment-sensitive tests own their fixtures.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Build allowlisted container
        run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} --tag fattyremediationci:${{ github.sha }} --tag fattyremediation:reviewcandidate .
      - name: Private cross-UID media handoff
        run: uv run python scripts/verify_media_handoff.py
      - name: Full tests including disposable PostgreSQL
        run: uv run pytest -q --junitxml=artifacts/pytest.xml
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Formatting
        run: uv run ruff format --check src tests scripts
      - name: Typecheck
        run: uv run mypy src
      - name: Compile and package
        run: uv run python -m compileall -q src tests scripts && uv build
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit 1
          done
      - name: Inert Compose validation
        env:
          POSTGRES_PASSWORD: testonly
        run: docker compose --env-file /dev/null config --quiet
      - name: Reject failed or skipped acceptance tests
        run: |
          uv run python -c 'import xml.etree.ElementTree as E; suites=list(E.parse("artifacts/pytest.xml").getroot().iter("testsuite")); assert suites; assert all(int(s.get(k, 0)) == 0 for s in suites for k in ("failures", "errors", "skipped"))'
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python }}
          path: artifacts/pytest.xml
          if-no-files-found: error
