x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *bounded-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fatty_trader
      POSTGRES_USER: fatty_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server environment}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatty_app -d fatty_trader"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    logging: *bounded-logging
    build: .
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "migrate"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fatty_trader
      PGUSER: fatty_app
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server environment}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  init:
    logging: *bounded-logging
    build: .
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "init"]
    environment:
      TRADER_MODE: LIVE
      SERVICE_NAME: init
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    logging: *bounded-logging
    build: .
    group_add: ["${CONSOLE_HOST_GID:-5013}"]
    environment:
      TRADER_MODE: LIVE
      BITGET_MODE: ${BITGET_MODE:-LIVE}
      BITGET_EXECUTION_ENABLED: ${BITGET_EXECUTION_ENABLED:-1}
      SERVICE_NAME: web
      CONSOLE_ENABLED: "1"
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:18081}
      CONSOLE_PASSWORD_HASH_FILE: /run/console-password.hash
      CONSOLE_ALLOW_LOCALHOST_HTTP: ${CONSOLE_ALLOW_LOCALHOST_HTTP:-0}
      CONSOLE_ACCOUNT_ID: ${CONSOLE_ACCOUNT_ID:-configured-bitget}
      CONSOLE_STATIC_DIR: /app/console-static
      CONSOLE_MEDIA_ROOT: /app/runtime/media
      CONSOLE_SECRET_STAGE_DIR: /run/console-stages
      CONSOLE_SECRET_PUBLIC_KEY_FILE: /run/console-public.pem
      CONSOLE_SECRET_STAGE_GID: ${CONSOLE_HOST_GID:-5013}
      CONSOLE_VAPID_PUBLIC_KEY_FILE: /run/web-push-public.txt
      # Progress is worker-owned; each socket validates identity in its own PID namespace.
      WEB_INTAKE_HEALTH_PATH: /run/fatty-health/intake/progress.json
      WEB_INTAKE_HEALTH_SOCKET_PATH: /run/fatty-health/intake/owner.sock
      WEB_ANALYZER_HEALTH_PATH: /run/fatty-health/analyzer/progress.json
      WEB_ANALYZER_HEALTH_SOCKET_PATH: /run/fatty-health/analyzer/owner.sock
      WEB_NOTIFICATION_HEALTH_PATH: /run/fatty-health/notification/progress.json
      WEB_NOTIFICATION_HEALTH_SOCKET_PATH: /run/fatty-health/notification/owner.sock
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fatty_trader
      PGUSER: fatty_console_web
      PGPASSWORD: ${CONSOLE_DB_PASSWORD:?set CONSOLE_DB_PASSWORD for isolated console web role}
    volumes:
      - health-intake:/run/fatty-health/intake:ro
      - health-analyzer:/run/fatty-health/analyzer:ro
      - health-notification:/run/fatty-health/notification:ro
      - ./runtime/console-stages:/run/console-stages
      - ./runtime/console-public.pem:/run/console-public.pem:ro
      - ./runtime/console-password.hash:/run/console-password.hash:ro
      - ./runtime/web-push-public.txt:/run/web-push-public.txt:ro
      - ./data/media:/app/runtime/media:ro
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-18081}:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import json, sys, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)); sys.exit(0 if data.get('status') == 'ok' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  intake:
    logging: *bounded-logging
    build: .
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "intake"]
    environment:
      TRADER_MODE: LIVE
      SERVICE_NAME: intake
      WORKER_HEALTH_PATH: /run/fatty-health/intake/progress.json
      WORKER_HEALTH_SOCKET_PATH: /run/fatty-health/intake/owner.sock
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fatty_trader
      PGUSER: fatty_worker
      PGPASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD for isolated runtime worker role}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      TELEGRAM_SOURCE_CHANNELS: ${TELEGRAM_SOURCE_CHANNELS:-@fattyfatclub}
      TELEGRAM_TARGET_CHAT_ID: ${TELEGRAM_TARGET_CHAT_ID:-}
      TELEGRAM_MEDIA_ROOT: /app/runtime/media
      # Catch-up safety net: the listen path is realtime-only, so a dropped/stolen MTProto
      # session used to lose every message in the blind window permanently (2026-09-27: the
      # source's ENA signal). This polls for messages newer than the newest persisted one.
      TELEGRAM_CATCHUP_SECONDS: ${TELEGRAM_CATCHUP_SECONDS:-60}
      TELEGRAM_CATCHUP_LIMIT: ${TELEGRAM_CATCHUP_LIMIT:-50}
    volumes:
      - health-intake:/run/fatty-health/intake
      - ./data/media:/app/runtime/media
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "intake", "--check"]
    restart: unless-stopped

  analyzer:
    logging: *bounded-logging
    build: .
    user: "${CODEX_HOST_UID:-5013}:${CODEX_HOST_GID:-5013}"
    # Image-only dedicated tree: intake UID/GID 10001 owns RW; analyzer only
    # receives group read/traverse (0640 files / 0750 directories) plus an RO mount.
    # Provision ./data/media as 10001:10001 mode 0750; never store credentials here.
    # Existing private media needs an explicitly approved permission migration;
    # application code intentionally does not chmod existing files/directories.
    group_add: ["10001"]
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "analyzer"]
    environment:
      TRADER_MODE: LIVE
      SERVICE_NAME: analyzer
      WORKER_HEALTH_PATH: /run/fatty-health/analyzer/progress.json
      WORKER_HEALTH_SOCKET_PATH: /run/fatty-health/analyzer/owner.sock
      DISPATCH_EXCHANGES: bitget
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fatty_trader
      PGUSER: fatty_worker
      PGPASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD for isolated runtime worker role}
      CODEX_HOME: /app/runtime/codex-home
      # Operator-supplied label only; this is NOT an auth probe (the analyzer prints it
      # as codex_account_label). Auth comes from the mounted ~/.codex/auth.json.
      CODEX_ACCOUNT_LABEL: ${CODEX_ACCOUNT_LABEL:-unset}
      BITGET_IMAGE_ANALYSIS_ENABLED: ${BITGET_IMAGE_ANALYSIS_ENABLED:-1}
    volumes:
      - health-analyzer:/run/fatty-health/analyzer
      - ./runtime/codex-home:/app/runtime/codex-home
      - type: bind
        source: ${CODEX_HOST_HOME:-/home/valarion/.codex}/auth.json
        target: /app/runtime/codex-home/auth.json
        read_only: true
      - ./data/media:/app/runtime/media:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "analyzer", "--check"]
    restart: unless-stopped

  dispatcher-binance:
    logging: *bounded-logging
    profiles: ["binance-disabled"]
    build: .
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "dispatcher-binance"]
    environment:
      TRADER_MODE: LIVE
      SERVICE_NAME: dispatcher-binance
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fatty_trader
      PGUSER: fatty_worker
      PGPASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD for isolated runtime worker role}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "dispatcher-binance", "--check"]
    restart: unless-stopped

  dispatcher-bitget:
    logging: *bounded-logging
    build: .
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "dispatcher-bitget"]
    environment:
      CONSOLE_ENABLED: "1"
      CONSOLE_ACCOUNT_ID: ${CONSOLE_ACCOUNT_ID:-configured-bitget}
      TRADER_MODE: ${TRADER_MODE:-LIVE}
      SERVICE_NAME: dispatcher-bitget
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fatty_trader
      PGUSER: fatty_worker
      PGPASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD for isolated runtime worker role}
      BITGET_API_KEY: ${BITGET_API_KEY:-}
      BITGET_API_SECRET: ${BITGET_API_SECRET:-}
      BITGET_API_PASSPHRASE: ${BITGET_API_PASSPHRASE:-}
      BITGET_MODE: ${BITGET_MODE:-LIVE}
      # Permanent production policy: overrides are validated, never silently coerced.
      FATTY_PRODUCTION_LIVE_ONLY: "1"
      BITGET_EXECUTION_ENABLED: ${BITGET_EXECUTION_ENABLED:-1}
      # Capability admission is separately gated and remains disabled by default.
      BITGET_PROTECTION_CAPABILITY_GATE_ENABLED: ${BITGET_PROTECTION_CAPABILITY_GATE_ENABLED:-0}
      BITGET_PROTECTION_STREAM_ENABLED: ${BITGET_PROTECTION_STREAM_ENABLED:-1}
      BITGET_PROTECTION_STREAM_MODE: ${BITGET_PROTECTION_STREAM_MODE:-observe}
      BITGET_PROTECTION_STREAM_MUTATIONS_ENABLED: ${BITGET_PROTECTION_STREAM_MUTATIONS_ENABLED:-0}
      BITGET_PROTECTION_STALE_SECONDS: ${BITGET_PROTECTION_STALE_SECONDS:-5}
      # Bounded read-only grace before containment: the venue accepts native plans and
      # makes them readable a moment later, and containing on the first readback closed
      # two live trades (WLD, NEAR) on 2026-10-18.
      BITGET_PROTECTION_GRACE_SECONDS: ${BITGET_PROTECTION_GRACE_SECONDS:-15}
      BITGET_PROTECTION_GRACE_INTERVAL_SECONDS: ${BITGET_PROTECTION_GRACE_INTERVAL_SECONDS:-3}
      BITGET_CANARY_MAX_ORDERS: ${BITGET_CANARY_MAX_ORDERS:-0}
      BITGET_CANARY_SYMBOL: ${BITGET_CANARY_SYMBOL:-}
      BITGET_APPROVAL_REFERENCE: ${BITGET_APPROVAL_REFERENCE:-}
      BITGET_MAX_CLOCK_SKEW_MS: ${BITGET_MAX_CLOCK_SKEW_MS:-5000}
      BITGET_DISPATCH_POLL_SECONDS: ${BITGET_DISPATCH_POLL_SECONDS:-10}
      BITGET_MONITOR_POLL_SECONDS: ${BITGET_MONITOR_POLL_SECONDS:-30}
      BITGET_PRODUCT_TYPE: USDT-FUTURES
      BITGET_MARGIN_COIN: USDT
      BITGET_MARGIN_MODE: isolated
      # Leverage CEILING is pinned at 20x and is never exceeded. The floor is the
      # lowest leverage the sizing policy may back off to when a signal's stop needs
      # more liquidation headroom than 20x leaves (per-symbol maintenance-margin rates
      # vary: a 2.5% MMR symbol has ~2.4% of room at 20x). Lower leverage is safer.
      # Automated signal sizing only; manual-order defaults are independent.
      BITGET_MARGIN_MODE_TYPE: ${BITGET_MARGIN_MODE_TYPE:-PERCENTAGE}
      BITGET_DEFAULT_LEVERAGE: ${BITGET_DEFAULT_LEVERAGE:-20}
      BITGET_MIN_LEVERAGE: "5"
      BITGET_MAX_LEVERAGE: "20"
      BITGET_ALLOCATION_PCT: ${BITGET_ALLOCATION_PCT:-0.20}
      BITGET_FIXED_MARGIN_USDT: ${BITGET_FIXED_MARGIN_USDT:-1}
      # Hard planned per-trade isolated-margin ceiling in USDT. Both percentage
      # of total equity and fixed-USDT sizing remain bound by available funds and
      # this non-editable cap, regardless of account growth or selected mode.
      # PLANNED margin: entries are market orders, so fill slippage can push
      # exchange-side realized margin marginally above it.
      BITGET_MAX_MARGIN_PER_TRADE_USDT: "1.1"
      BITGET_MAX_NORMAL_POSITIONS: "5"
      BITGET_LIQUIDATION_BUFFER: "0.10"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "dispatcher-bitget", "--check"]
    restart: unless-stopped

  monitor-binance:
    profiles: ["binance-disabled"]
    extends:
      service: dispatcher-binance
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "monitor-binance"]
    environment:
      SERVICE_NAME: monitor-binance

  monitor-bitget:
    extends:
      service: dispatcher-bitget
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "monitor-bitget"]
    environment:
      SERVICE_NAME: monitor-bitget
      # Liveness: exit-and-restart when the monitor stops cycling. On 2026-09-27 the
      # process spun at 100% CPU with a blocked event loop for 3h50m and the inherited
      # dispatcher healthcheck still reported it healthy.
      BITGET_MONITOR_HEARTBEAT_PATH: ${BITGET_MONITOR_HEARTBEAT_PATH:-/tmp/fatty-monitor-heartbeat}
      BITGET_MONITOR_CYCLE_TIMEOUT_SECONDS: ${BITGET_MONITOR_CYCLE_TIMEOUT_SECONDS:-120}
      BITGET_MONITOR_STALL_TIMEOUT_SECONDS: ${BITGET_MONITOR_STALL_TIMEOUT_SECONDS:-90}
      # Owner policy (2026-10-19): a position whose exchange-side SL/TP cannot be
      # confirmed is never closed by us; it is marked locally managed and the *local*
      # lanes close it at the signal stop when the live price crosses it. The exchange
      # stop stays wherever it is placed and remains the backstop, so both lanes carry
      # mutations. Rollback for either trigger: set the value back to 0 and recreate.
      BITGET_FALLBACK_MUTATIONS_ENABLED: ${BITGET_FALLBACK_MUTATIONS_ENABLED:-1}
      BITGET_PROTECTION_STREAM_ENABLED: ${BITGET_PROTECTION_STREAM_ENABLED:-1}
      BITGET_PROTECTION_STREAM_MODE: ${BITGET_PROTECTION_STREAM_MODE:-observe}
      BITGET_PROTECTION_STREAM_STALE_SECONDS: ${BITGET_PROTECTION_STREAM_STALE_SECONDS:-5}
      BITGET_PROTECTION_STREAM_HEARTBEAT_SECONDS: ${BITGET_PROTECTION_STREAM_HEARTBEAT_SECONDS:-25}
      BITGET_PROTECTION_STREAM_MUTATIONS_ENABLED: ${BITGET_PROTECTION_STREAM_MUTATIONS_ENABLED:-1}
      BITGET_PROTECTION_STREAM_SYMBOLS: ${BITGET_PROTECTION_STREAM_SYMBOLS:-}
      BITGET_PROTECTION_REST_WATCHDOG_SECONDS: ${BITGET_PROTECTION_REST_WATCHDOG_SECONDS:-5}
      # Consecutive socket-death/provider-failure cycles before the protection
      # stream latches its entry block. Plumbed here so tuning .env actually
      # reaches the container; the in-code default (3) is only a fallback.
      BITGET_PROTECTION_STALE_CYCLES_BEFORE_LATCH: ${BITGET_PROTECTION_STALE_CYCLES_BEFORE_LATCH:-3}
    healthcheck:
      # Probe this service *and* verify the cycle heartbeat is fresh. The inherited
      # dispatcher probe validated configuration only, which is why the 3h50m stall
      # still reported (healthy); docker now marks the container unhealthy and the
      # supervisor thread exits the process so restart:unless-stopped recovers it.
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-m",
          "fatty_trader.service",
          "--service",
          "monitor-bitget",
          "--check",
          "--heartbeat-path",
          "/tmp/fatty-monitor-heartbeat",
          "--heartbeat-max-age",
          "90",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  operator-bot:
    logging: *bounded-logging
    build: .
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "operator-bot"]
    environment:
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:18081}
      CONSOLE_ALLOW_LOCALHOST_HTTP: ${CONSOLE_ALLOW_LOCALHOST_HTTP:-0}
      TRADER_MODE: ${TRADER_MODE:-LIVE}
      SERVICE_NAME: operator-bot
      CONSOLE_ENABLED: "1"
      CONSOLE_ACCOUNT_ID: ${CONSOLE_ACCOUNT_ID:-configured-bitget}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fatty_trader
      PGUSER: fatty_worker
      PGPASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD for isolated runtime worker role}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_OPERATOR_ID: ${TG_OPERATOR_ID:-}
      TELEGRAM_SOURCE_CHANNELS: ${TELEGRAM_SOURCE_CHANNELS:-}
      BITGET_MODE: ${BITGET_MODE:-LIVE}
      BITGET_API_KEY: ${BITGET_API_KEY:-}
      BITGET_API_SECRET: ${BITGET_API_SECRET:-}
      BITGET_API_PASSPHRASE: ${BITGET_API_PASSPHRASE:-}
      FATTY_PRODUCTION_LIVE_ONLY: "1"
      BITGET_EXECUTION_ENABLED: ${BITGET_EXECUTION_ENABLED:-1}
      BITGET_OPERATOR_MUTATIONS_ENABLED: ${BITGET_OPERATOR_MUTATIONS_ENABLED:-0}
      BITGET_FALLBACK_MUTATIONS_ENABLED: ${BITGET_FALLBACK_MUTATIONS_ENABLED:-0}
      BITGET_PROTECTION_STREAM_ENABLED: ${BITGET_PROTECTION_STREAM_ENABLED:-0}
      BITGET_PROTECTION_STREAM_MODE: ${BITGET_PROTECTION_STREAM_MODE:-observe}
      BITGET_PROTECTION_STREAM_MUTATIONS_ENABLED: ${BITGET_PROTECTION_STREAM_MUTATIONS_ENABLED:-0}
      BITGET_PROTECTION_CAPABILITY_GATE_ENABLED: ${BITGET_PROTECTION_CAPABILITY_GATE_ENABLED:-0}
      TELEGRAM_HEARTBEAT_SECONDS: ${TELEGRAM_HEARTBEAT_SECONDS:-21600}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "operator-bot", "--check"]
    restart: unless-stopped

  notification-sender:
    logging: *bounded-logging
    build: .
    volumes:
      - health-notification:/run/fatty-health/notification
      - ./runtime/web-push-private.pem:/run/web-push-private.pem:ro
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.notification_service"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fatty_trader
      PGUSER: fatty_worker
      PGPASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD for isolated runtime worker role}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TELEGRAM_TARGET_CHAT_ID: ${TELEGRAM_TARGET_CHAT_ID:-}
      WEB_PUSH_VAPID_PRIVATE_KEY_FILE: /run/web-push-private.pem
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-https://trade.warga-digital.com}
      WEB_PUSH_TTL_SECONDS: ${WEB_PUSH_TTL_SECONDS:-3600}
      WORKER_HEALTH_PATH: /run/fatty-health/notification/progress.json
      WORKER_HEALTH_SOCKET_PATH: /run/fatty-health/notification/owner.sock
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-5}
      NOTIFICATION_LEASE_SECONDS: ${NOTIFICATION_LEASE_SECONDS:-30}
      NOTIFICATION_RETRY_SECONDS: ${NOTIFICATION_RETRY_SECONDS:-30}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-10}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "fatty_trader.notification_service", "--check"]
    restart: unless-stopped

  source-management:
    logging: *bounded-logging
    build: .
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "source-management"]
    environment:
      TRADER_MODE: ${TRADER_MODE:-LIVE}
      SERVICE_NAME: source-management
      CONSOLE_ENABLED: "1"
      CONSOLE_ACCOUNT_ID: ${CONSOLE_ACCOUNT_ID:-configured-bitget}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: fatty_trader
      PGUSER: fatty_worker
      PGPASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD for isolated runtime worker role}
      BITGET_API_KEY: ${BITGET_API_KEY:-}
      BITGET_API_SECRET: ${BITGET_API_SECRET:-}
      BITGET_API_PASSPHRASE: ${BITGET_API_PASSPHRASE:-}
      BITGET_MODE: ${BITGET_MODE:-LIVE}
      FATTY_PRODUCTION_LIVE_ONLY: "1"
      BITGET_EXECUTION_ENABLED: ${BITGET_EXECUTION_ENABLED:-1}
      # Owned-entry cancellation uses the same gated execution factory; no entry
      # admission is invoked by source management and the fixed cap stays intact.
      BITGET_MAX_MARGIN_PER_TRADE_USDT: "1.1"
      BITGET_OPERATOR_MUTATIONS_ENABLED: "1"
      SOURCE_MANAGEMENT_POLL_SECONDS: ${SOURCE_MANAGEMENT_POLL_SECONDS:-30}
      BITGET_CANARY_MAX_ORDERS: ${BITGET_CANARY_MAX_ORDERS:-5}
      BITGET_APPROVAL_REFERENCE: ${BITGET_APPROVAL_REFERENCE:-hernanda-approved-live-20260908}
      BITGET_MAX_CLOCK_SKEW_MS: ${BITGET_MAX_CLOCK_SKEW_MS:-5000}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "fatty_trader.service", "--service", "source-management", "--check"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  console-worker:
    extends:
      service: dispatcher-bitget
    command: ["/app/.venv/bin/python", "-m", "fatty_trader.console.worker"]
    environment:
      SERVICE_NAME: console-worker
      CONSOLE_ENABLED: "1"
      CONSOLE_ACCOUNT_ID: ${CONSOLE_ACCOUNT_ID:-configured-bitget}
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:18081}
      CONSOLE_ALLOW_LOCALHOST_HTTP: ${CONSOLE_ALLOW_LOCALHOST_HTTP:-0}
      CONSOLE_HEARTBEAT_FILE: /tmp/console-worker-heartbeat
      CONSOLE_SNAPSHOT_RETENTION_DAYS: ${CONSOLE_SNAPSHOT_RETENTION_DAYS:-7}
      CONSOLE_EVENT_RETENTION_HOURS: ${CONSOLE_EVENT_RETENTION_HOURS:-48}
      CONSOLE_RETENTION_BATCH_SIZE: ${CONSOLE_RETENTION_BATCH_SIZE:-1000}
      CONSOLE_RETENTION_INTERVAL_SECONDS: ${CONSOLE_RETENTION_INTERVAL_SECONDS:-60}
      BITGET_OPERATOR_MUTATIONS_ENABLED: ${BITGET_OPERATOR_MUTATIONS_ENABLED:-0}
      BITGET_FALLBACK_MUTATIONS_ENABLED: ${BITGET_FALLBACK_MUTATIONS_ENABLED:-0}
      BITGET_PROTECTION_STREAM_ENABLED: ${BITGET_PROTECTION_STREAM_ENABLED:-1}
      BITGET_MARGIN_MODE_TYPE: ${BITGET_MARGIN_MODE_TYPE:-PERCENTAGE}
      BITGET_DEFAULT_LEVERAGE: ${BITGET_DEFAULT_LEVERAGE:-20}
      BITGET_ALLOCATION_PCT: ${BITGET_ALLOCATION_PCT:-0.20}
      BITGET_FIXED_MARGIN_USDT: ${BITGET_FIXED_MARGIN_USDT:-1}
      BITGET_PROTECTION_STREAM_MODE: ${BITGET_PROTECTION_STREAM_MODE:-observe}
      BITGET_PROTECTION_STREAM_MUTATIONS_ENABLED: ${BITGET_PROTECTION_STREAM_MUTATIONS_ENABLED:-0}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_OPERATOR_ID: ${TG_OPERATOR_ID:-}
      TELEGRAM_MEDIA_ROOT: /app/runtime/media
    volumes:
      - ./data/media:/app/runtime/media:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "fatty_trader.console.worker", "--check"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# Linux-only, ephemeral metadata volumes. Sticky directories permit analyzer's
# non-root UID; only its owner has RW access, web has RO, no other service mounts it.
volumes:
  health-intake:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=1777
  health-analyzer:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=1777
  health-notification:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=1777
